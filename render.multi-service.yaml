services:
  - name: roblox-whitelist-api
    type: web
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    disk:
      name: whitelist-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - fromGroup: whitelist-shared
      - key: DATA_FILE
        value: /var/data/whitelist-storage.json
      - key: CODE_TTL_MINUTES
        value: 15
      - key: DISCORD_ALLOWED_ROLE_IDS
        sync: false
      - key: ROBLOX_SHARED_SECRET
        sync: false

  - name: roblox-whitelist-bot
    type: worker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run bot
    envVars:
      - fromGroup: whitelist-shared
      - key: API_HOSTPORT
        fromService:
          name: roblox-whitelist-api
          type: web
          property: hostport
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false

envVarGroups:
  - name: whitelist-shared
    envVars:
      - key: INTERNAL_API_KEY
        generateValue: true
